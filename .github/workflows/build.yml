name: Build Fabric 26.3
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Python for resource validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Build and check
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
      - name: Upload installable mod and sources
        uses: actions/upload-artifact@v4
        with:
          name: pvp-overhaul-26.3-${{ matrix.os }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
