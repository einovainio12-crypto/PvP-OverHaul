import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
 group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    splitEnvironmentSourceSets()
    mods {
        pvpoverhaul {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
def obsoleteResourcePaths = new JsonSlurper().parse(file("scripts/obsolete_resources.json"))
processResources {
    // Old browser uploads may leave v0.1 spear resources behind; never package those.
    exclude obsoleteResourcePaths
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
tasks.register('validateResources', Exec) {
    commandLine 'python3', 'scripts/validate_resources.py'
}
tasks.register('balanceChecks', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.pvpoverhaul.BalanceChecks'
}
tasks.named('check') { dependsOn 'validateResources', 'balanceChecks' }

// BalanceChecks is a standalone Java main executed by balanceChecks, not a JUnit test.
// Keep real framework test failures fatal, but permit this source set to discover none.
tasks.named('test', org.gradle.api.tasks.testing.Test).configure {
    failOnNoDiscoveredTests.set(false)
}
